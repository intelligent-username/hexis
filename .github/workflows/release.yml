name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from CHANGELOG
        id: version
        run: |
          echo "=== Extracting Version ==="
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path

          changelog = re.sub(r"<!--[\s\S]*?-->", "", Path("CHANGELOG.md").read_text())
          match = re.search(r"(?m)^## (\d+\.\d+\.\d+)(?=:|\s|$)", changelog)
          print(match.group(1) if match else "")
          PY
          )
          echo "Extracted version: '$VERSION'"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          echo "=== Setting up Signing Keystore & local.properties ==="
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::warning::KEYSTORE_BASE64 secret is missing or empty!"
          else
            echo "KEYSTORE_BASE64 secret is present."
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          echo "storeFile=release.jks" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "local.properties configured successfully."

      - name: Compile release APK
        run: |
          echo "=== Compiling Release APK ==="
          ./gradlew :androidApp:assembleRelease

      - name: Locate APK
        id: apk
        run: |
          echo "=== Locating Output APK ==="
          APK=$(find androidApp/build/outputs/apk/release -name 'Hexis-v*.apk' -type f | head -1)
          echo "Found APK at: $APK"
          if [ -z "$APK" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          echo "=== Preparing Release Artifact ==="
          cp "${{ steps.apk.outputs.path }}" "Hexis-v${{ steps.version.outputs.version }}.apk"
          echo "Copied ${{ steps.apk.outputs.path }} -> Hexis-v${{ steps.version.outputs.version }}.apk"

      - name: Extract Release Notes from CHANGELOG
        run: |
          echo "=== Extracting Release Notes ==="
          python3 -c "
          import re
          content = open('CHANGELOG.md', 'r', encoding='utf-8').read()
          content = re.sub(r'<!--[\s\S]*?-->', '', content)
          version = '${{ steps.version.outputs.version }}'
          banner_url = 'https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/fastlane/metadata/android/en-US/images/banner.png'
          match = re.search(r'(## ' + re.escape(version) + r'[^\n]*\n)(.*)', content, re.DOTALL)
          if match:
              headline = match.group(1).strip()
              rest = match.group(2)
              body_match = re.search(r'(.*?)(?=\n## |\Z)', rest, re.DOTALL)
              body = body_match.group(1).strip() if body_match else ''
              notes = f'{headline}\n\n![Banner]({banner_url})\n\n{body}'
          else:
              notes = f'![Banner]({banner_url})\n\n' + content
          with open('release_notes.txt', 'w', encoding='utf-8') as f:
              f.write(notes)
          "
          echo "Generated release_notes.txt:"
          cat release_notes.txt

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          APK="Hexis-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "=== Updating GitHub Release $TAG ==="
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release_notes.txt
          else
            echo "=== Creating GitHub Release $TAG ==="
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release_notes.txt \
              --generate-notes
          fi
